version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: unit_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: unit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: unit_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/unit_db
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

